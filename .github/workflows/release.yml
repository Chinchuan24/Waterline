name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: scripts/test.sh
      - name: Build and package
        run: ./build.sh --all --zip
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/Waterline-AppleSilicon.zip build/Waterline-Intel.zip \
            --title "Waterline $GITHUB_REF_NAME" \
            --generate-notes
